name: Deploy all services

on:
  push:
    branches: [main]

jobs:
  cd-job:
    runs-on: self-hosted
    steps:
      - name: Pull updates
        run: git pull
        working-directory: /home/gh-actor/project/deploy

      - name: Up services
        run: docker compose up -d
        working-directory: /home/gh-actor/project/deploy


